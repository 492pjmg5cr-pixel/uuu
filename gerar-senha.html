<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerar senha do administrador</title>
<style>body{font:16px system-ui,sans-serif;max-width:520px;margin:32px auto;padding:0 16px}input,button{font:inherit;padding:10px;width:100%;margin:6px 0 12px;box-sizing:border-box}code{display:block;word-break:break-all;background:#eee;padding:10px;border-radius:8px}</style></head>
<body><h1>Senha do administrador</h1>
<p>Digite o usuário e a senha que você quer usar. Copie o código gerado para <b>ADM_HASH</b> no arquivo <b>config.js</b>.</p>
<label>Usuário<input id="u" autocomplete="off"></label>
<label>Senha<input id="p" type="password" autocomplete="off"></label>
<button id="g">Gerar</button><code id="o">—</code>
<p style="text-align:center;color:#6f6c64;font-size:12px;margin-top:24px">Desenvolvido por <b>Maicon da Rosa Gonçalves</b></p>
<script>
document.getElementById('g').onclick=async()=>{
  const t=document.getElementById('u').value.trim().toLowerCase()+':'+document.getElementById('p').value;
  const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
  document.getElementById('o').textContent=h;
};
</script>
</body></html>
